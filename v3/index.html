<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="競輪予想">
<meta name="theme-color" content="#0b6b4f">
<title>競輪予想 Ver.3</title>
<style>
/* 使う人がするのは「貼る」だけ。画面は1枚、タブもボタンもない。
   車番の色札がそのまま買い目になる。白地と墨、緑の帯、数字は等幅。 */
:root{color-scheme:light dark;--bg:light-dark(#f4f6f4,#0f1412);--card:light-dark(#ffffff,#18201c);--ink:light-dark(#141a17,#e9efeb);--sub:light-dark(#5b6762,#9aa8a1);
--line:light-dark(#dde4df,#2b3631);--band:#0b6b4f;--chart:light-dark(#08845a,#3fb27c);--band2:#08553f;--hit:light-dark(#0b7a3e,#5fd394);--miss:light-dark(#b3261e,#ff8a80);--warn:light-dark(#8a5a00,#ffcc66);
--k:light-dark(#0d5fa8,#7cb8ff);--s:light-dark(#3d4a44,#c5d1cb);--a:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;overflow-x:clip;padding-bottom:40px}
header{background:var(--band);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--band2)}
header h1{margin:0;font-size:19px;line-height:1.2;letter-spacing:.02em}
header .meta{font-size:12.5px;opacity:.9;display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
header .meta span{white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:17px}.card h3{margin:12px 0 6px;font-size:15px}
.sub{color:var(--sub);font-size:13.5px}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #2e9f78;outline-offset:1px}
button{font:inherit;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;cursor:pointer}
button.main{background:var(--band);border-color:var(--band);color:#fff;font-weight:700;width:100%}
button.sm{min-height:38px;font-size:14px;padding:0 12px}
button.sel{background:var(--band);border-color:var(--band);color:#fff;font-weight:700}
td:first-child{white-space:nowrap}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.grid label{font-size:12.5px;color:var(--sub);display:block}
.car{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font-weight:800;font-size:15px;margin-right:3px;font-variant-numeric:tabular-nums;border:1px solid rgba(0,0,0,.25)}
.c1{background:#fff;color:#111}.c2{background:#111;color:#fff;border-color:#555}.c3{background:#d7261e;color:#fff}.c4{background:#1f5bd1;color:#fff}.c5{background:#f6d21c;color:#111}
.c6{background:#18904a;color:#fff}.c7{background:#f08a1c;color:#111}.c8{background:#f49ac1;color:#111}.c9{background:#7b3fb3;color:#fff}
.bet{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bet:first-of-type{border-top:0}
.bet .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:800;font-size:15px;color:#fff}
.b-堅め{background:var(--k)}.b-標準{background:#5b6762}.b-荒れ{background:var(--a)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12px;color:var(--sub)}
.hit{color:var(--hit)}.miss{color:var(--miss)}.warn{color:var(--warn)}
.banner{border-radius:14px;padding:14px;color:#fff;font-weight:800;font-size:22px;text-align:center;margin-bottom:10px}
.banner.h{background:#0b7a3e}.banner.m{background:#7d2420}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--sub);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.why{font-size:14px;margin:4px 0 0;padding-left:10px;border-left:3px solid var(--line)}
.why b{font-weight:700}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.msg{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14.5px;margin-top:8px;white-space:pre-wrap}
.msg.err{border-color:var(--miss);color:var(--miss)}
.msg.ok{border-color:var(--hit)}
@media (prefers-reduced-motion:no-preference){.card.new{animation:rise .35s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media(max-width:600px){table{font-size:13.5px}}
.paste{min-height:150px;font-size:16px}
.howto{margin:0 0 10px;font-size:15px}
.howto b{color:var(--band)}
.foot{border:0;margin:6px 0 0;padding:0}
.foot summary{font-weight:400;color:var(--sub);font-size:13.5px;justify-content:center}
#out{scroll-margin-top:64px}
#recKpi .kpi{grid-template-columns:repeat(2,1fr)}
.chart{position:relative;margin:12px 0 4px}
.chart h3{margin:0 0 2px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart .ax{font-size:11px;fill:var(--sub);font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;top:30px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.ver{text-align:center;color:var(--sub);font-size:12px;margin:10px 0 0}
.wait{padding:10px 0;border-top:1px solid var(--line)}.wait:first-of-type{border-top:0}
.rec{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}.rec:first-child{border-top:0}
</style>
</head>

<header>
  <h1>競輪予想</h1>
</header>
<main>
  <div class="card" id="installCard" hidden>
    <h2>アプリとして入れる</h2>
    <p class="sub" id="installNote" style="margin:0 0 8px">押すと、アプリ一覧に「競輪予想3」が入ります。次からはアイコンから開けます。</p>
    <button class="main" id="installBtn" hidden>アプリとして入れる</button>

  </div>

      <div id="footMsg"></div>
    </div>

</main>

    const kim=stats&&f.length>=13&&f.slice(7,13).every(x=>/^\d+$/.test(x));
    const mark=row[0] in MARKS?row[0]:null;
    const r={id,name:prev.slice(0,ageI>0?ageI:1).join(""),age:ageI>0?+prev[ageI].replace("歳",""):null,
      pref:ageI>0?(prev[ageI+1]??null):null,cls:prev.find(x=>/^[ASL][123]$/.test(x))??null,
      style:prev.find(x=>/^(?:逃|両|追)$/.test(x))??null,gear:num(prev.find(x=>/^[1-5]\.\d{2}$/.test(x))),
      score:+row[scoreAt]||null,noScore:!(+row[scoreAt]),mark,
      starts:stats?f.slice(0,4).map(Number):null,win:stats?num(f[4]):null,quin:stats?num(f[5]):null,place:stats?num(f[6]):null,
      kim:kim?{逃:+f[7],捲:+f[8],差:+f[9],マ:+f[10]}:null,S:kim?+f[11]:null,B:kim?+f[12]:null};
    if(r.win!=null&&r.win>100)r.win=null;
    if(/[(（]?(?:取消|欠場|欠車)[)）]?/u.test(r.name)||/(?:^|\s)(?:取消|欠場|欠車)(?:\s|$)/u.test(line)){r.scratched=true;r.name=r.name.replace(/[(（]?(?:取消|欠場|欠車)[)）]?/gu,"");}
    if(riders.has(id))warn.push(id+"番が重複しています（後の行を採用）");

  }
  return {riders:[...riders.values()].sort((a,b)=>a.id-b.id),warn};
}
function parseLines(text,ids){
  const rows=normal(text).split("\n");
  const at=rows.findIndex(l=>/(?:周回予想|ライン予想|並び予想)/u.test(l));
  if(at<0)return {lines:[],note:"並び（周回予想）が見つかりません"};
  const same=rows[at].replace(/^.*?(?:周回予想|ライン予想|並び予想)[\s:|]*/u,"");
  const body=[];
  if(same.trim())body.push(same);
  for(const l of rows.slice(at+1)){
    if(!l.trim()){if(body.length)break;else continue;}
    if(/^[1-9\s=←→–−/・|,.-]+$/u.test(l)){body.push(l);if(body.length>=3)break;}else break;
  }
  const raw=body.join("\t\t").replace(/\s+$/u,"");
  const groups=raw.split(/\s*[/・|,]\s*|\t\t+| {2,}/u).map(g=>g.trim()).filter(Boolean);
  const lines=groups.map(g=>(g.match(/[1-9]/g)??[]).map(Number)).filter(l=>l.length);
  const flat=lines.flat();
  if(flat.length!==ids.length||new Set(flat).size!==ids.length||flat.some(x=>!ids.includes(x)))
    return {lines:[],note:"並びの車番が出走表と一致しません"};
  return {lines,note:null};
}

/* ---------- 3連複オッズ ---------- */
const betKind=/3\s*連\s*(?:勝\s*)?複(?:式)?|三連複|三連勝複式/gu;
const betPat=(suffix="")=>new RegExp("(?<!\\d)([1-9])\\s*[-=＝–−－]\\s*([1-9])\\s*[-=＝–−－]\\s*([1-9])(?!\\d)"+suffix,"g");
function trioSections(raw){
  return [...raw.matchAll(betKind)].map(m=>raw.slice(m.index+m[0].length)
    .split(/(?:(?:^|\n)[ \t|]*単(?:[ \t|]|$)|3\s*連\s*(?:勝\s*)?単|2\s*(?:車|枠)\s*(?:連\s*)?[単複]|ワイド|払戻一覧)/u)[0]);
}
function matrixOdds(section,riders){
  const h=/^\s*発売票数\s*:\s*[\d,]+\s*票[ \t]*$/mu.exec(section);
  if(!h)return [];
  const rows=section.slice(h.index+h[0].length).split("\n").map(x=>x.trim()).filter(Boolean);
  const names=new Map(riders.map(r=>[r.id,r.name]));
  const ids=[...names.keys()].sort((a,b)=>a-b), out=[];
  const head=(row,id)=>{const m=/^([1-9])\s+(.+)$/u.exec(row??"");return !!m&&+m[1]===id&&nameKey(m[2])===names.get(id);};
  const price=/^(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?$/u;
  let c=0;
  for(let a=0;a<ids.length-2;a++){
    if(!head(rows[c++],ids[a]))return out;
    for(let b=a+1;b<ids.length-1;b++){
      if(!head(rows[c++],ids[b]))return out;
      for(let d=b+1;d<ids.length;d++){
        const m=/^([1-9])(?:[ \t]+(.+))?$/u.exec(rows[c++]??"");
        if(!m||+m[1]!==ids[d])return out;
        const v=m[2]??rows[c++];
        if(/^(?:[-–—]+|発売なし|発売無し|欠場)$/u.test(v??""))continue;
        if(!price.test(v??""))return out;
        out.push([[ids[a],ids[b],ids[d]],Number(v.replaceAll(",",""))]);
      }
    }
  }
  return out;
}
function parseOdds(text,riders){
  const raw=normal(text), ids=riders.map(r=>r.id), odds={}, warn=[];
  for(const sec of trioSections(raw)){
    const rows=[...sec.matchAll(betPat("[ \\t|:\\n]+(\\d[\\d,]*(?:\\.\\d+)?)(?![\\d.,-]|[ \\t]*円)"))].map(m=>[m.slice(1,4).map(Number),Number(m[4].replaceAll(",",""))]);
    for(const [nums,v] of [...rows,...matrixOdds(sec,riders)]){
      if(new Set(nums).size!==3||nums.some(x=>!ids.includes(x))||!(v>=1))continue;
      const k=keyOf(nums);
      if(k in odds&&odds[k]!==v)warn.push(k+"に異なるオッズ（後の値を採用）");
      odds[k]=v;
    }
  }
  return {odds,warn};
}
function envOf(text){
  const t=normal(text);
  const w=t.match(/(晴|曇|雨|雪|霧)(?:れ|り)?[^\n]{0,8}?風速\s*(\d+(?:\.\d+)?)\s*m/u);
  const wind=t.match(/風速[ \t:]*(\d+(?:\.\d+)?)[ \t]*m/u);
  const weather=w?.[1]??t.match(/天候[ \t:]*\n?[ \t]*(晴|曇|雨|雪|霧)/u)?.[1]??null;
  return {weather,wind:w?+w[2]:wind?+wind[1]:null};
}

/* レースの貼り付け（出走表＋オッズ）を読む */
function parseEntry(text){
  const {riders,warn}=parseRiders(text);
  const ids=riders.map(r=>r.id);
  if(ids.length<5||ids.length>9)throw Error("5〜9車の出走表を読み取れませんでした（読めた車数 "+ids.length+"）。チャリロトの出走表詳細とオッズ表詳細をまとめて貼り付けてください。");
  const od=parseOdds(text,riders), env=envOf(text), idt=identity(text);
  const priced=Object.keys(od.odds), notes=[];
  let rs=riders, ids2=ids;
  const scr=riders.filter(r=>r.scratched).map(r=>r.id);
  if(scr.length&&ids.length-scr.length>=5){rs=riders.filter(r=>!r.scratched);ids2=rs.map(r=>r.id);notes.push("取消・欠場："+scr.map(x=>x+"番").join("・")+"（予想から除外）");}
  if(priced.length>=Math.ceil(C3(ids.length)/3)){
    const seen=new Set(priced.flatMap(k=>k.split("-").map(Number)));
    const out=ids2.filter(id=>!seen.has(id));
    if(out.length&&ids2.length-out.length>=5){rs=rs.filter(r=>seen.has(r.id));ids2=rs.map(r=>r.id);notes.push("欠場とみなした車："+out.map(x=>x+"番").join("・")+"（3連複のオッズがないため除外）");}
  }
  let ln=parseLines(text,ids2);
  if(!ln.lines.length&&ids2.length<ids.length){
    const full=parseLines(text,ids);
    if(full.lines.length)ln={lines:full.lines.map(l=>l.filter(x=>ids2.includes(x))).filter(l=>l.length),note:null};
  }
  return {riders:rs,ids:ids2,lines:ln.lines,odds:od.odds,env,identity:idt,grade:gradeOf(text),
    girls:rs.length>0&&rs.every(r=>r.cls&&r.cls.startsWith("L"))||/ガールズ/u.test(normal(text)),
    notes:[...warn,...od.warn,...notes,...(ln.note?[ln.note]:[])]};
}

/* ---------- 結果表 ---------- */
function resultFinish(raw,ids){
  const rows=raw.split("\n"), fin={};
  const h=rows.findIndex(r=>/(?:^|[\s|])着(?:順)?[\s|].*車番.*選手名/u.test(r));
  if(h<0)return fin;
  const body=rows.slice(h+1).map(r=>r.trim()).filter(r=>r&&!/^[-| ]+$/.test(r));
  const st=/^(?:[1-9](?:着|同着)?|欠(?:場)?|失(?:格)?|落(?:車|棄)?|棄権|未完走)$/u;
  for(let i=0;i<body.length;i++){
    let row=body[i], it=row.split(/[\t ]+/u);
    if(/欠場|欠車/u.test(row)&&/^[1-9]$/.test(it[0])&&!/^[1-9]$/.test(it[1]||"")){const id=Number(it[0]);if(ids.includes(id))fin[id]={rank:null,status:"欠場",method:null,agari:null,hb:false};continue;}
    if(!st.test(it[0]))break;
    if(it.length===1&&body[i+1]){row+="\t"+body[++i];it=row.split(/[\t ]+/u);}
    const id=Number(it[1]);
    if(!ids.includes(id))continue;
    const rank=/^[1-9]/u.test(it[0])?Number(it[0][0]):null;
    const agari=it.slice(3).find(x=>/^1\d\.\d$/.test(x));
    fin[id]={rank,status:it[0],method:row.match(/逃げ|捲(?:く)?り|差し|マーク/u)?.[0]?.replace("捲くり","捲り")??null,agari:agari?+agari:null,hb:/(?:^|\s)(?:H|B|HB)(?:\s|$)/u.test(row.slice(row.indexOf(it[2]||"")))};
  }
  return fin;
}
function parseResult(text,ids){
  const raw=normal(text);
  const voided=/レース(?:は|が)?[ \t]*(?:中止|不成立)|全(?:車券|組番)(?:を|の)?[ \t]*返還/u.test(raw);
  const pays=new Map();
  for(const sec of trioSections(raw))
    for(const m of sec.matchAll(betPat("[ \\t\\n:|]+(\\d[\\d,]*)[ \\t]*円"))){
      const nums=m.slice(1,4).map(Number);
      if(new Set(nums).size!==3||nums.some(x=>!ids.includes(x)))continue;
      pays.set(keyOf(nums),+m[4].replaceAll(",",""));
    }
  const finish=resultFinish(raw,ids);
  const refund=new Set(Object.entries(finish).filter(([,f])=>/^欠/.test(f.status||"")).map(([id])=>Number(id)));
  for(const m of raw.matchAll(/返還(?:車番|対象車番)[ \t|:]*([1-9](?:[ \t]*[,、・/][ \t]*[1-9]|[ \t]+[1-9])*)/gu))for(const x of m[1].match(/[1-9]/g))if(ids.includes(+x))refund.add(+x);
  let winners=[...pays].map(([key,pay])=>({key,pay}));
  let estimated=false;
  if(!winners.length&&!voided){
    const top=Object.entries(finish).filter(([,v])=>v.rank&&v.rank<=3).map(([k])=>+k);
    if(top.length===3){winners=[{key:keyOf(top),pay:null}];estimated=true;}
  }
  return {winners,finish,voided,estimated,refundIds:[...refund],env:envOf(raw),identity:identity(raw)};
}

function newState(){

    kappa:{},venue:{},vglobal:{逃:0,捲:0,差:0,マ:0},rider:{},wx:{},loops:0,metaRuns:[],changes:[]};

function migrate(s){
  const d=newState(); s=s&&typeof s==="object"?s:{};
  for(const k of Object.keys(d))if(!(k in s))s[k]=d[k];

/* ---------- 特徴量（エンジンE01〜E26） ---------- */
function gkOf(meta){return meta.girls?"ガールズ":(meta.grade||"不明");}
function shares(r){
  const k=r.kim, t=k?k.逃+k.捲+k.差+k.マ:0;
  if(k&&t>0)return {逃:k.逃/t,捲:k.捲/t,差:k.差/t,マ:k.マ/t};
  if(r.style==="逃")return {逃:1,捲:0,差:0,マ:0};
  if(r.style==="両")return {逃:.5,捲:.5,差:0,マ:0};
  if(r.style==="追")return {逃:0,捲:0,差:.5,マ:.5};
  return null;
}
function features(race,state){
  const {riders,lines,odds,meta}=race, ids=riders.map(r=>r.id), n=ids.length, v=state.vars;
  const lineOf=new Map(), posOf=new Map();
  lines.forEach((l,li)=>l.forEach((id,p)=>{lineOf.set(id,li);posOf.set(id,p);}));
  const hasLines=lines.length>0;
  const meanScore=sum(riders.map(r=>r.score||0))/n;
  const raw={};
  const col=f=>riders.map(r=>{const x=f(r);return Number.isFinite(x)?x:null;});
  const tot=r=>r.starts?sum(r.starts):0;
  const sh=riders.map(shares);
  const front=r=>{const li=lineOf.get(r.id);return hasLines&&lines[li].length>=2&&posOf.get(r.id)===0?1:0;};
  const frontness=riders.map((r,i)=>sh[i]?sh[i].逃+(front(r)?.5:0):null);
  raw.E01=col(r=>r.score);
  raw.E02=col(r=>CLS[r.cls]);
  raw.E03=col(r=>r.win);raw.E04=col(r=>r.quin);raw.E05=col(r=>r.place);
  raw.E06=col(r=>tot(r)>0?(3*r.starts[0]+2*r.starts[1]+r.starts[2])/tot(r):null);
  for(const [e,m] of [["E07","逃"],["E08","捲"],["E09","差"],["E10","マ"]])raw[e]=sh.map(s=>s?s[m]:null);
  raw.E11=col(r=>tot(r)>0&&r.S!=null?r.S/tot(r):null);
  raw.E12=col(r=>tot(r)>0&&r.B!=null?r.B/tot(r):null);
  raw.E13=col(r=>r.gear);
  raw.E14=col(r=>r.age!=null?-r.age:null);
  raw.E15=riders.map(r=>hasLines?sum(lines[lineOf.get(r.id)].map(id=>(riders.find(x=>x.id===id).score||meanScore)-meanScore)):null);
  raw.E16=riders.map(r=>hasLines?front(r):null);
  raw.E17=riders.map(r=>hasLines?(lines[lineOf.get(r.id)].length>=2&&posOf.get(r.id)===1?1:0):null);
  raw.E18=riders.map(r=>hasLines?(posOf.get(r.id)>=2?1:0):null);
  raw.E19=riders.map(r=>hasLines?(lines[lineOf.get(r.id)].length===1?1:0):null);
  raw.E20=riders.map(r=>hasLines?lines[lineOf.get(r.id)].length:null);
  raw.E21=riders.some(r=>r.mark)?riders.map(r=>MARKS[r.mark]??0):riders.map(()=>null);
  const wind=meta.indoor?0:meta.wind, rain=meta.weather?(meta.weather==="雨"||meta.weather==="雪"?1:0):null;
  raw.E22=frontness.map(f=>f!=null&&wind!=null?wind*f:null);
  raw.E23=frontness.map(f=>f!=null&&rain!=null&&!meta.indoor?rain*f:null);
  raw.E24=sh.map(s=>s&&meta.bank?((meta.bank-400)/100)*(s.差+s.マ-s.逃-s.捲):null);
  const p0=3/n;
  const mem=riders.map(r=>state.rider[nameKey(r.name)]);
  raw.E25=mem.some(m=>m&&m.n>0)?mem.map(m=>((m?.top3||0)+v.riderK0*p0)/((m?.n||0)+v.riderK0)):riders.map(()=>null);
  const vs=state.venue[meta.venue], vg=state.vglobal, gN=sum(Object.values(vg));
  if(vs&&sum(Object.values(vs))>0){
    const N=sum(Object.values(vs));
    const rate=m=>((vs[m]||0)+v.venueK0*((vg[m]+1)/(gN+4)))/(N+v.venueK0);
    const g=m=>(vg[m]+1)/(gN+4);
    raw.E26=sh.map(s=>s?sum(["逃","捲","差","マ"].map(m=>s[m]*(rate(m)-g(m))))*10:null);
  }else raw.E26=riders.map(()=>null);
  const z={}, act={};
  for(const e of FEAT){
    const x=raw[e], pres=x.filter(a=>a!=null);
    let ok=pres.length>=2;
    const mu=ok?sum(pres)/pres.length:0, sd=ok?Math.sqrt(sum(pres.map(a=>(a-mu)**2))/pres.length):0;
    ok=ok&&sd>1e-9;

  }
  riders.forEach((r,i)=>{if(r.noScore&&act.E01)z.E01[i]=-1.5;});

  const combos=[];
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)combos.push([a,b,c]);
  const keys=combos.map(t=>keyOf(t.map(i=>ids[i])));
  const same=(i,j)=>hasLines&&lineOf.get(ids[i])===lineOf.get(ids[j]);

/* ---------- 確率（E27〜E30） ---------- */
function effTheta(state,F){

}
function dist(F,th){
  const n=F.n, s=new Array(n).fill(0);
  for(const e of FEAT){const w=th.w[e]||0;if(!w)continue;const z=F.z[e];for(let i=0;i<n;i++)s[i]+=w*z[i];}
  const mx=Math.max(...s), lam=s.map(x=>Math.exp(x-mx)), L=sum(lam);
  const lk=F.combos.map(([a,b,c],j)=>{
    const A=lam[a],B=lam[b],Cc=lam[c];
    const pl=A/L*(B/(L-A)*Cc/(L-A-B)+Cc/(L-A)*B/(L-A-Cc))+B/L*(A/(L-B)*Cc/(L-B-A)+Cc/(L-B)*A/(L-B-Cc))+Cc/L*(A/(L-Cc)*B/(L-Cc-A)+B/(L-Cc)*A/(L-Cc-B));
    return Math.log(Math.max(pl,1e-300))+th.u1*F.g1[j]+th.u2*F.g2[j];
  });
  const Z=lse(lk); for(let j=0;j<lk.length;j++)lk[j]-=Z;
  const beta=F.lqm?sig(th.b):1, tau=Math.exp(clamp(th.t,-2,2));
  const zz=lk.map((x,j)=>tau*(beta*x+(1-beta)*(F.lqm?F.lqm[j]:0)));

  return {p:zz.map(x=>Math.exp(x-Z2)),lp:zz.map(x=>x-Z2),lk,s,beta,tau};
}
function lossOf(F,th,key){const j=F.keys.indexOf(key);if(j<0)return null;return -dist(F,th).lp[j];}

/* ---------- 区分（E33）：全数と割合 ---------- */
function kappaOf(state,gk,n){
  const v=state.vars, K=state.kappa;
  const est=(st,prior)=>st&&st.N>0?(st.H+v.k0*(st.S/st.N)*prior)/(st.S+v.k0*(st.S/st.N)):prior;
  const g=est(K["全体"],1), cn=est(K["n"+n],g);

function classify(state,F,p){

  const src=F.lqm?F.lqm.map(Math.exp):p;
  const top=[...src].sort((a,b)=>b-a);
  const P3=sum(top.slice(0,3)), kap=kappaOf(state,F.gk,n), P3c=clamp(P3*kap,0,1);

  return {cat,P3,P3c,kappa:kap,Tlo,Thi,base,src:F.lqm?"オッズ":"モデル"};

/* ---------- 買い目（E34）：1〜3点・取りガミなし ---------- */
function choose(state,F,d,race,cat,aOverride){

  const idx=d.p.map((p,j)=>j).sort((x,y)=>d.p[y]-d.p[x]).slice(0,Math.max(3,v.candM));
  const odds=race.odds, anyOdds=F.nOdds>0;
  let best=null;
  const ok=(j,k)=>{const o=odds[F.keys[j]];return anyOdds?(o>=1&&o>k*v.torigami):true;};
  const consider=S=>{
    const k=S.length, ph=sum(S.map(j=>d.p[j]));
    const ret=anyOdds?sum(S.map(j=>d.p[j]*odds[F.keys[j]]))/k:1;
    const U=a*Math.log(ph)+(1-a)*Math.log(Math.max(ret,1e-9));
    if(!best||U>best.U+1e-12)best={S,U,ph,ret,k};
  };
  for(let k=v.minPts;k<=v.maxPts;k++){
    const c=idx.filter(j=>ok(j,k));
    if(c.length<k)continue;
    if(k===1)for(const x of c)consider([x]);
    if(k===2)for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)consider([c[i],c[j]]);
    if(k===3)for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)for(let l=j+1;l<c.length;l++)consider([c[i],c[j],c[l]]);

  const bets=best.S.sort((x,y)=>d.p[y]-d.p[x]).map(j=>({key:F.keys[j],odds:odds[F.keys[j]]??null,p:d.p[j],ev:odds[F.keys[j]]?d.p[j]*odds[F.keys[j]]:null}));
  return {bets,phit:best.ph,roi:best.ret,k:best.k,a,forced:!!best.forced,torigamiSafe:bets.every(b=>b.odds==null||b.odds>bets.length*v.torigami)};
}

/* ---------- 予想（観察→状況判断→意思決定→実行） ---------- */
function buildRace(parsed,metaIn,state){

    grade:metaIn.grade||parsed.grade||"不明",girls:metaIn.girls??parsed.girls,n:parsed.ids.length};
  const wx=state.wx[meta.date+" "+meta.venue];

  const wIn=metaIn.wind!==""&&metaIn.wind!=null?Number(metaIn.wind):null;
  meta.wind=Number.isFinite(wIn)?wIn:parsed.env.wind??wx?.wind??null;
  meta.wxSrc=metaIn.wxSrc||(metaIn.weather||Number.isFinite(wIn)?"入力":parsed.env.weather||parsed.env.wind!=null?"出走表":wx?"同日の結果表":null);
  meta.bank=bankOf(meta.venue);meta.indoor=INDOOR.includes(meta.venue);

  const id=meta.date&&meta.venue&&meta.raceNo?meta.date+" "+meta.venue+" "+meta.raceNo+"R":"未特定 "+new Date().toISOString().slice(0,16);

}
function predict(race,state){
  const F=features(race,state), th=effTheta(state,F), d=dist(F,th);

  F.keys.forEach((k,j)=>k.split("-").forEach(x=>marg[x]+=d.p[j]));
  const rank={};F.ids.slice().sort((a,b)=>marg[b]-marg[a]).forEach((id,i)=>rank[id]=i+1);
  const top=d.p.map((p,j)=>({key:F.keys[j],p,odds:race.odds[F.keys[j]]??null,mk:F.lqm?Math.exp(F.lqm[j]):null})).sort((a,b)=>b.p-a.p).slice(0,10);
  const actN=FEAT.filter(e=>F.act[e]).length;
  const contrib={};
  F.ids.forEach((id,i)=>{contrib[id]=FEAT.map(e=>({e,c:(th.w[e]||0)*F.z[e][i]})).filter(x=>Math.abs(x.c)>1e-6).sort((a,b)=>b.c-a.c);});
  const mRank={};
  if(F.lqm)F.lqm.map((x,j)=>({x,j})).sort((a,b)=>b.x-a.x).forEach((o,i)=>mRank[F.keys[o.j]]=i+1);
  const ooda={
    観察:`${F.n}車立・オッズ${F.nOdds}/${F.keys.length}通り（全数）・並び${race.lines.length?race.lines.map(l=>l.join("")).join(" / "):"なし"}・天候${race.meta.weather??"未取得"}・風速${race.meta.wind??"未取得"}m`,
    状況判断:`選手エンジン${actN}/26稼働・${cls.cat}（上位3組の確率${r2(cls.P3*100,1)}%→実績補正後${r2(cls.P3c*100,1)}%、境界 荒れ<${r2(cls.Tlo*100,1)}%・堅め≥${r2(cls.Thi*100,1)}%）`,
    意思決定:`${pick.bets.length}点 ${pick.bets.map(b=>b.key).join("・")}（的中確率${r2(pick.phit*100,1)}%・期待回収率${r2(pick.roi*100,0)}%）`,
    実行:`記録して結果待ち。結果表を貼ると照合・学習へ進む`};
  const pdca={計画:`目標：的中確率${r2(pick.phit*100,1)}%・期待回収率${r2(pick.roi*100,0)}%・投資${pick.bets.length*state.vars.yen}円・取りガミ${pick.torigamiSafe?"なし":"あり（警告）"}`,実行:"予想を記録",評価:"結果待ち",改善:"結果待ち"};
  return {F,pred:{at:new Date().toISOString(),cat:cls.cat,cls,bets:pick.bets,phit:pick.phit,roi:pick.roi,a:pick.a,forced:pick.forced,torigamiSafe:pick.torigamiSafe,
    rank,marg,top,contrib,mRank,beta:d.beta,tau:d.tau,actN,act:{...F.act},ooda,pdca}};
}

/* ---------- 勝因・敗因（E35） ---------- */
const EN=Object.fromEntries(ENGINES.map(e=>[e.id,e.name]));
function why(list,sign){
  const agg={};for(const x of list||[])agg[x.e]=(agg[x.e]||0)+x.c;
  const xs=Object.entries(agg).map(([e,c])=>({e,c})).filter(x=>sign>0?x.c>0:x.c<0).sort((a,b)=>sign>0?b.c-a.c:a.c-b.c).slice(0,2);
  return xs.length?xs.map(x=>EN[x.e]).join("・"):"目立つ根拠なし";
}
function analyze(race,res){
  const P=race.pred, win=res.winners.map(w=>w.key), R=new Set((win[0]||"").split("-").map(Number));
  const nm=id=>race.riders.find(r=>r.id===id)?.name||"";
  const fin=res.finish||{};
  const mr=win[0]&&P.mRank?P.mRank[win[0]]:null;
  const bets=P.bets.map(b=>{
    const B=b.key.split("-").map(Number), hit=win.includes(b.key);
    const match=B.filter(x=>R.has(x)), miss=[...R].filter(x=>!B.includes(x)), wrong=B.filter(x=>!R.has(x));
    let w,l;
    if(hit){
      w=`3車的中（${B.map(x=>x+"番 評価"+P.rank[x]+"位").join("、")}）。主な根拠：${why([].concat(...B.map(x=>P.contrib[x]||[])),1)}`;
      const weak=B.reduce((a,x)=>P.rank[x]>P.rank[a]?x:a,B[0]);
      l=P.rank[weak]>3?`${weak}番（${nm(weak)}）の評価が${P.rank[weak]}位と低く、点数配分に余地。弱く見た理由：${why(P.contrib[weak],-1)}`:"この買い目の弱点は小さい（3車とも評価上位）。他の買い目で投資が分散した";
    }else{
      w=match.length?`${match.map(x=>x+"番（評価"+P.rank[x]+"位・"+(fin[x]?.rank?fin[x].rank+"着":"着順不明")+"）").join("、")}は的中。根拠：${why([].concat(...match.map(x=>P.contrib[x]||[])),1)}`:"一致した車はなし";
      const ms=miss.map(x=>`${x}番（${nm(x)}・評価${P.rank[x]}位・${fin[x]?.rank??"?"}着${fin[x]?.method?"・"+fin[x].method:""}）を外した。低く見た理由：${why(P.contrib[x],-1)}`);
      const ws=wrong.map(x=>`${x}番（評価${P.rank[x]}位）は${fin[x]?.rank?fin[x].rank+"着":"圏外"}。重く見すぎた要素：${why(P.contrib[x],1)}`);
      l=[...ms,...ws].join("。");
    }
    return {key:b.key,odds:b.odds,p:b.p,hit,win:w,loss:l};
  });
  const P3hit=mr!=null&&mr<=3;
  const note=mr?`結果${win[0]}は人気${mr}番目（${race.odds[win[0]]??"?"}倍）。${P3hit?"人気上位3組で決着":"人気上位3組の外で決着"}。区分「${P.cat}」は${(P.cat==="堅め")===P3hit||P.cat==="標準"?"概ね想定内":"想定と逆"}`:"";
  return {bets,note,P3hit};
}

/* ---------- 学習（1レース1周）とメタループ ---------- */
/* 損失 −log p(結果) とその勾配（解析的に計算） */
const ORD=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
function lossGrad(F,th,key){
  const J=F.keys.indexOf(key);if(J<0)return null;
  const n=F.n, s=new Array(n).fill(0);
  for(const e of FEAT){const w=th.w[e]||0;if(!w)continue;const z=F.z[e];for(let i=0;i<n;i++)s[i]+=w*z[i];}
  let mx=-Infinity;for(const x of s)if(x>mx)mx=x;
  const lam=s.map(x=>Math.exp(x-mx)), L=sum(lam), m=F.combos.length;
  const a=new Array(m), dl=new Array(m);
  for(let j=0;j<m;j++){
    const t3=F.combos[j];let PL=0;const dv=new Float64Array(n);
    for(const o of ORD){
      const x=t3[o[0]],y=t3[o[1]],z=t3[o[2]], d2=L-lam[x], d3=d2-lam[y];
      const P=lam[x]/L*lam[y]/d2*lam[z]/d3;PL+=P;
      for(let i=0;i<n;i++){let g=-lam[i]/L;if(i!==x){g-=lam[i]/d2;if(i!==y)g-=lam[i]/d3;}if(i===x||i===y||i===z)g+=1;dv[i]+=P*g;}
    }

    dl[j]=dv;a[j]=Math.log(PL)+th.u1*F.g1[j]+th.u2*F.g2[j];
  }
  const Za=lse(a), lk=a.map(x=>x-Za);

  const zz=lk.map((x,j)=>tau*(beta*x+(1-beta)*(hasM?F.lqm[j]:0))), Z=lse(zz);

}
function evalLoss(state,races){

  return n?L/n:null;

const settledOf=races=>races.filter(r=>r.F&&r.result&&!r.result.voided&&r.result.winners?.length&&!r.legacy);
const PLABEL=p=>p.startsWith("w.")?p.slice(2)+" "+EN[p.slice(2)]:{u1:"E31 ライン内決着",u2:"E32 先頭・番手セット",b:"E30 モデルの比率",t:"E30 市場の鋭さ"}[p];
function learnOne(state,race,all){
  const v=state.vars, F=race.F, key=race.result.winners[0].key;
  if(!F||F.keys.indexOf(key)<0)return {skipped:"学習対象外（組番が出走表と一致しません）"};
  const before=clone(state);
  const dg=state.dG[F.gk]||(state.dG[F.gk]=zeroT()), dn=state.dN[F.n]||(state.dN[F.n]=zeroT());
  const g=lossGrad(F,effTheta(state,F),key).g;
  const prop=PARAMS.map(p=>{
    const reg=v.l2g*(getP(state.theta,p)-getP(state.theta0,p));
    return {p,d:clamp(-v.eta*(g[p]+reg),-v.cap,v.cap),g:g[p]};
  }).filter(x=>Math.abs(x.g)>1e-7).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const chosen=prop.slice(0,v.topK);
  for(const c of chosen){
    setP(state.theta,c.p,getP(state.theta,c.p)+c.d);
    for(const D of [dg,dn]){const x=getP(D,c.p);setP(D,c.p,x+clamp(-v.eta*v.dRate*(c.g+v.l2d*x),-v.cap,v.cap));}

  }else state.vars.eta=Math.min(v.etaMax,v.eta*1.05);

  return {kept:!worse,Lb,La,eta:state.vars.eta,changes:chosen.map(c=>({p:c.p,label:PLABEL(c.p),d:r2(c.d,4)}))};

/* 照合時の記録更新（κ・場別・選手・天候） */
function absorb(state,race,res){
  const F=race.F, key=res.winners[0]?.key;
  if(F&&F.lqm&&key){
    const src=F.lqm.map(Math.exp), order=src.map((p,j)=>j).sort((a,b)=>src[b]-src[a]);
    const P3=sum(order.slice(0,3).map(j=>src[j])), H=order.slice(0,3).some(j=>F.keys[j]===key)?1:0;

  }

  const m=firstId&&res.finish[firstId].method;
  const mk={"逃げ":"逃","捲り":"捲","差し":"差","マーク":"マ"}[m];
  if(mk&&race.meta.venue){const vs=state.venue[race.meta.venue]||(state.venue[race.meta.venue]={逃:0,捲:0,差:0,マ:0});vs[mk]++;state.vglobal[mk]++;}

    const k=nameKey(r.name), s=state.rider[k]||(state.rider[k]={n:0,top3:0,wins:0});

function settle(race,res,state,all){

    learn:{kept:L.kept,Lb:L.Lb,La:L.La,eta:L.eta,changes:L.changes||[],skipped:L.skipped||null},
    pdca:{...P.pdca,実行:`${P.bets.length}点 ${stake}円`,評価:`${an.bets.some(b=>b.hit)?"的中":"不的中"}${an.bets.some(b=>b.refund)?"・一部返還":""}（予想した的中確率${r2(pHit*100,1)}%）・払戻${ret}円・収支${ret-stake>=0?"+":""}${ret-stake}円`,
      改善:L.skipped?L.skipped:L.kept?`変数${(L.changes||[]).length}個を更新（${(L.changes||[]).map(c=>c.label+(c.d>0?" +":" ")+c.d).join("、")||"変更なし"}）`:`更新すると直近${v.evalN}レースの成績が悪化するため巻き戻し・学習率を下げた`},
    A:{改善:(L.changes||[]).map(c=>c.label).join("、")||"なし",改良:`学習率→${r2(L.eta,4)}`,実装:L.kept?"反映":"保留",自己分析:L.Lb!=null?`直近${Math.min(v.evalN,settledOf(all).length)}レースの損失 ${r2(L.Lb,4)}→${r2(L.La,4)}`:"比較対象なし",再実装:L.kept?"維持":"巻き戻し",ループ:`通算${state.loops}周`},

/* メタループ：全レースで変数を最適化。強さ（過学習防止）は交差検証で決める（メタループのメタループ） */

}
function gradAll(state,races,l2g,l2d){
  const G={theta:{},dG:{},dN:{}};const add=(o,p,v)=>{o[p]=(o[p]||0)+v;};

function fit(state,races,l2g,l2d,maxIt,tol){

const LADDER=[.003,.01,.03,.1,.3,1,3];
function sigOf(races){

  const reset=s=>{s.theta=clone(s.theta0);s.dG={};s.dN={};};

      chosen:lf.adopted?lf.chosen:null,adopted:!!lf.adopted,before:r2(before,4),after:r2(after,4),iterations:it,a};

/* 区分ごとの的中重視度を実績で補正（理論値を基準に縮小推定） */
function tuneA(state,racesAll){
  const races=settledOf(racesAll), out={}, RANGE={堅め:[.6,.95],標準:[.4,.7],荒れ:[.1,.5]};
  for(const [cat,k] of [["堅め","aKatame"],["標準","aStd"],["荒れ","aAre"]]){
    const rs=races.filter(r=>r.pred?.cat===cat), [lo,hi]=RANGE[cat];

    let best=null;

/* ---------- 成績 ---------- */

    live:agg(rs.filter(r=>!r.replay)),replay:agg(rs.filter(r=>r.replay))};
}

return {VERSION,normal,keyOf,C3,identity,gradeOf,parseEntry,parseResult,parseRiders,parseLines,parseOdds,ENGINES,FEAT,PARAMS,W0,VARS_DEF,

})();

<script>
{
const $=id=>document.getElementById(id);

const Drive={server:"Google Drive",mcp:null,folder:null,sub:null,ok:null,

  why(e){

    return {needs_reauth:"Googleドライブの再接続が必要です（claude.ai の設定 → コネクタ）。",server_not_connected:"Googleドライブがつながっていません（claude.ai の設定 → コネクタ で追加）。",
      approval_required:"ドライブへの保存の許可が必要です。もう一度ボタンを押して「許可」を選んでください。",not_in_manifest:"このページではドライブの利用が許可されていません。",
      selection_required:"Googleドライブのコネクタが複数あります。表示された画面で1つ選んでください。",server_unavailable:"ドライブに一時的につながりません。少し待ってからもう一度。",
      blocked_by_policy:"組織の設定でドライブが使えません。",tool_error:"ドライブが処理できませんでした。"}[c]||("ドライブとのやり取りに失敗しました。")+((e?.message||(typeof e==="string"?e:""))?"（詳細："+String(e.message||e).slice(0,80)+"）":"");
  },
  async call(tool,input){return await this.mcp.callTool(this.server,tool,input);},
  async findOrMake(title,parent){
    const q=`title = '${title}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`+(parent?` and parentId = '${parent}'`:"");
    const r=await this.call("search_files",{query:q,excludeContentSnippets:true,pageSize:10});
    const files=r.payload?.files||[];
    if(files.length)return files[0].id;
    const c=await this.call("create_file",{title,contentMimeType:"application/vnd.google-apps.folder",...(parent?{parentId:parent}:{})});
    if(!c.payload?.id)throw Error("フォルダ「"+title+"」を作成できませんでした。");
    return c.payload.id;
  },
  async folders(){
    if(!this.folder)this.folder=await this.findOrMake(FOLDER,null);
    if(!this.sub)this.sub=await this.findOrMake(SUBFOLDER,this.folder);
    return {main:this.folder,sub:this.sub};
  },
  async put(title,obj,parent){
    const text=JSON.stringify(obj);
    if(new TextEncoder().encode(text).length>950000)throw Error("1ファイルが大きすぎます（"+title+"）。");
    const r=await this.call("create_file",{title,parentId:parent,contentMimeType:"application/json",disableConversionToGoogleType:true,textContent:text});
    return r.payload;
  },
  async saveRace(r,kind){
    const f=await this.folders();
    const name="競輪Ver3_"+r.id.replace(/\s+/g,"_")+"_"+kind+".json";
    const {rider,changes,metaRuns,...core}=S;
    await this.put(name,{format:"keirin-v3-race",version:K.VERSION,savedAt:new Date().toISOString(),
      説明:"競輪予想Ver.3の1レース分の記録（予想・結果・勝因・敗因・学習の変化）と、その時点の学習済みの変数。",race:r,learned:core},f.sub);
    this.ok=true;
  },
  async saveFull(){
    const f=await this.folders();
    const t=new Date(Date.now()+9*3600e3).toISOString().slice(0,16).replace(/[-:]/g,"").replace("T","_");
    const parts=splitFull(fullData());
    let last;
    for(let i=0;i<parts.length;i++)last=await this.put("競輪Ver3_全データ_"+t+"_"+(i+1)+"-"+parts.length+".json",parts[i],f.main);
    this.ok=true;S.lastFull=new Date().toISOString();
    return {title:"競輪Ver3_全データ_"+t+"（"+parts.length+"ファイル）"};
  },
  decode(res){
    const b64=s=>{const bin=atob(s.replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
    const tryText=s=>{if(typeof s!=="string")return null;const t=s.trim();if(t.startsWith("{"))return t;try{const d=b64(t);if(d.trim().startsWith("{"))return d;}catch(e){}return null;};
    const p=res?.payload;
    if(p&&typeof p==="object"&&p.format)return JSON.stringify(p);
    let t=tryText(p);if(t)return t;
    if(p&&typeof p==="object")for(const k of ["content","data","base64Content","blob","text","fileContent"]){t=tryText(p[k]);if(t)return t;}
    for(const c of res?.content||[]){t=tryText(c.text)||tryText(c.resource?.text)||tryText(c.resource?.blob)||tryText(c.blob);if(t)return t;}
    return null;
  },
  async restore(){
    const f=await this.folders();
    const r=await this.call("search_files",{query:`'${f.main}' in ancestors and title contains '競輪Ver3_' and mimeType = 'application/json' and trashed = false`,excludeContentSnippets:true,pageSize:100,orderBy:"modifiedTime desc"});
    const files=r.payload?.files||[];
    const re=/全データ_(\d{8}_\d{4})(?:_(\d+)-(\d+))?/;
    const groups={};
    for(const x of files){const m=x.title.match(re);if(m)(groups[m[1]]=groups[m[1]]||[]).push({...x,part:+(m[2]||1),total:+(m[3]||1)});}
    const key=Object.keys(groups).sort().pop();
    const full=key?groups[key].sort((a,b)=>a.part-b.part):[];
    if(full.length&&full.length<full[0].total)throw Error("全データ（"+key+"）の分割ファイルがそろっていません（"+full.length+"/"+full[0].total+"）。");
    const since=full.length?full.map(x=>x.modifiedTime).sort()[0]:"";
    const later=files.filter(x=>!re.test(x.title)&&x.modifiedTime>since).sort((a,b)=>a.modifiedTime.localeCompare(b.modifiedTime));
    let n=0;
    for(const file of [...full,...later]){
      let res,text;
      try{res=await this.call("download_file_content",{fileId:file.id});text=this.decode(res);}catch(e){}
      if(!text){try{res=await this.call("read_file_content",{fileId:file.id});text=this.decode(res);}catch(e){}}
      if(!text)throw Error("「"+file.title+"」を読み取れませんでした。ドライブからダウンロードして「読み込み」で選んでください。");
      mergeData(JSON.parse(text));n++;
    }
    if(!n)throw Error("ドライブに保存済みのデータが見つかりません。");
    return n;
  }
};

    state:S,races:Object.values(R)};

function mergeData(d){
  if(!d||typeof d!=="object")throw Error("読み込めない形式です。");
  if(d.format==="keirin-v3-race"){
    const r=d.race;if(r?.id){const o=R[r.id];if(!o||(r.settle&&!o.settle)||(Date.parse(r.updatedAt||r.createdAt)>Date.parse(o.updatedAt||o.createdAt)))R[r.id]=r;}
    if(d.learned&&Date.parse(d.savedAt)>Date.parse(S.updatedAt||0))S=K.migrate({...S,...d.learned,updatedAt:d.savedAt});
    return;
  }
  if(d.format!=="keirin-v3-backup")throw Error("競輪予想Ver.3のデータではありません。");
  for(const r of d.races||[]){if(!r?.id)continue;const o=R[r.id];if(!o||(r.settle&&!o.settle)||Date.parse(r.updatedAt||r.createdAt)>Date.parse(o.updatedAt||o.createdAt))R[r.id]=r;}
  if(d.state&&(!S.updatedAt||Date.parse(d.savedAt)>Date.parse(S.updatedAt)))S=K.migrate({...d.state,updatedAt:d.savedAt});
}
function splitFull(d,limit=700000){
  const enc=s=>new TextEncoder().encode(s).length;
  const {races,state,...head}=d;
  const parts=[{...head,state,races:[]}];let size=enc(JSON.stringify(parts[0]));
  for(const r of races){
    const b=enc(JSON.stringify(r))+1;
    if(size+b>limit&&parts[parts.length-1].races.length){parts.push({...head,races:[]});size=enc(JSON.stringify(head))+20;}
    parts[parts.length-1].races.push(r);size+=b;
  }
  return parts;
}
const allRaces=()=>Object.values(R).sort((a,b)=>(a.meta?.date||"").localeCompare(b.meta?.date||"")||((a.meta?.raceNo||0)-(b.meta?.raceNo||0))||String(a.meta?.venue).localeCompare(String(b.meta?.venue)));

async function handle(text){
  // ① 出走表とオッズ表
  let parsed=null, src=text;
  try{parsed=K.parseEntry(text);}catch(e){}
  // ② 2回目からのオッズ表だけ（同じレースの出走表を使う）
  if(!parsed){
    const idt=K.identity(text), prev=idt&&R[idt.id];
    if(prev&&!prev.settle&&prev.raw?.entry&&/3\s*連\s*複/u.test(K.normal(text))){
      const s2=K.normal(prev.raw.entry).split(/オッズ表詳細|3\s*連\s*(?:勝\s*)?複/u)[0]+"\n"+text;
      try{const p=K.parseEntry(s2);if(Object.keys(p.odds).length>=K.C3(p.ids.length)/2){parsed=p;src=s2;}}catch(e){}
    }
  }
  if(parsed)return predictFrom(parsed,src);
  // ③ 結果
  return settleFrom(text);
}

/* ---------- 予想 ---------- */
async function predictFrom(parsed,src){
  const idt=parsed.identity;
  const old=idt&&R[idt.id];
  if(old?.settle){show(old);msg("pasteMsg","このレースは結果まで済んでいます。","ok");return;}
  let metaIn={};
  if(idt&&idt.date===todayJst()&&!(parsed.env.weather&&parsed.env.wind!=null)&&!S.wx[idt.date+" "+idt.venue]){
    try{const w=Drive.avail()?await Wx.get(idt.venue):await OpenWx.get(idt.venue);
      if(w&&(w.weather||w.wind!=null))metaIn={weather:w.weather||"",wind:w.wind??"",wxSrc:"外部の天気（現在："+w.phrase+"）"};}catch(e){}
  }
  const race=K.buildRace(parsed,metaIn,S);
  const prev=R[race.id];
  const {F,pred}=K.predict(race,S);
  Object.assign(race,{F,pred,raw:{entry:src},oddsAt:new Date().toISOString(),createdAt:prev?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),revisions:(prev?.revisions||0)+(prev?1:0)});
  R[race.id]=race;
  show(race);
  msg("pasteMsg",prev?"最新のオッズで予想し直しました。":"", "ok");
  await persist([race],prev?null:"予想");
}

/* ---------- 結果 ---------- */
async function settleFrom(text){
  const idt=K.identity(text);
  let race=idt?R[idt.id]||null:null;
  if(!race&&!idt){const open=openRaces();if(open.length===1&&/払戻|着/u.test(K.normal(text)))race=open[0];}
  if(!race){
    if(idt&&/払戻/u.test(K.normal(text)))throw Error(idt.id+" の予想がありません。先に、このレースの出走表とオッズ表を貼ってください。");
    throw Error(NOREAD);
  }
  if(race.settle){show(race);msg("pasteMsg","このレースの結果はもう反映済みです。","ok");return;}
  const res=K.parseResult(text,race.F.ids);
  if(!res.winners.length&&!res.voided)throw Error("結果を読み取れませんでした。KEIRIN.JPの結果ページを全部選んで貼り付けてください。");
  if(res.winners[0]&&!race.F.keys.includes(res.winners[0].key))throw Error("結果の車番（"+res.winners[0].key+"）が、このレースの出走表と合いません。");
  K.settle(race,res,S,allRaces());
  race.raw={...race.raw,result:text};race.updatedAt=new Date().toISOString();
  S.updatedAt=race.updatedAt;
  show(race);msg("pasteMsg","");
  await persist([race],"結果");
  autoLearn();
}

/* ---------- 学習の見直し（すべて自動・画面には出さない） ---------- */
let learning=false;
async function autoLearn(){
  if(learning)return;
  let need=false;
  try{for(const y of K.metaLoop(S,allRaces(),{quickOnly:true})){if(y.done){need=!!y.needFull;if(y.run){S.updatedAt=new Date().toISOString();await Store.save([]);}break;}}}catch(e){return;}
  if(!need)return;
  learning=true;
  try{
    const T=JSON.parse(JSON.stringify(S));
    const g=K.metaLoop(T,allRaces(),{});
    for(;;){const y=g.next().value;if(!y||y.done)break;await new Promise(z=>setTimeout(z,0));}
    Object.assign(S,{theta:T.theta,dG:T.dG,dN:T.dN,vars:T.vars,metaRuns:T.metaRuns,updatedAt:new Date().toISOString()});
    await Store.save([]);
  }catch(e){}
  learning=false;
}

/* ---------- 保存（自動） ---------- */
async function persist(races,kind){
  try{await Store.save(races);}catch(e){msg("pasteMsg",e.message,"err");}
  renderLists();
  if(Drive.avail()&&races.length===1&&kind){
    try{await Drive.saveRace(races[0],kind);
      if(!S.lastFull||Date.now()-Date.parse(S.lastFull)>20*3600e3){await Drive.saveFull().catch(()=>{});await Store.save([]);}
    }catch(e){}
  }
}

}
function renderLists(){
  const open=openRaces().filter(r=>r.id!==shownId).reverse().slice(0,12);
  $("waitCard").hidden=!open.length;
  $("waitList").innerHTML=open.map(r=>`<div class="wait"><div class="row" style="justify-content:space-between"><b>${esc(r.id)}</b><span class="badge b-${esc(r.pred?.cat||"標準")}" style="font-size:12.5px">${esc(r.pred?.cat||"—")}</span></div>
    ${(r.pred?.bets||[]).map(b=>`<div class="row" style="margin-top:4px">${cars(b.key)}<b>${esc(b.key)}</b><span class="sub">${b.odds!=null?b.odds.toFixed(1)+"倍":""}</span></div>`).join("")}</div>`).join("");
  const live=allRaces().filter(r=>!r.replay), done=live.filter(r=>r.settle);
  $("recCard").hidden=!done.length;
  if(!done.length)return;
  const s=K.stats(live).all;
  $("recKpi").innerHTML=`<div class="kpi"><div><b>${s.races}</b><span>レース</span></div><div><b>${s.hitRaces}</b><span>的中</span></div><div><b class="${s.profit>=0?"hit":"miss"}">${s.profit>=0?"+":""}${yen(s.profit)}</b><span>収支</span></div><div><b>${pct(s.roi,0)}</b><span>回収率</span></div></div>`;
  drawChart(done);
  $("recList").innerHTML=[...done].reverse().slice(0,10).map(r=>{const st=r.settle;
    return `<div class="rec"><span>${esc(r.id)}</span><span><b class="${st.hit?"hit":"miss"}">${st.voided?"返還":st.hit?"的中":"はずれ"}</b> ${st.profit>=0?"+":""}${yen(st.profit)}</span></div>`;}).join("");
}

/* ---------- 成績のグラフ：収支の移り変わり（見るだけ。指でなぞると各レースの数字） ---------- */
const sgn=n=>(n>0?"+":"")+yen(n);
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x)));for(const m of [1,2,5,10])if(m*p>=x)return m*p;return 10*p;}
function drawChart(done){
  const box=$("recChart");
  const rs=[...done].sort((a,b)=>(a.id.slice(0,10)+(a.settle.at||a.updatedAt||"")).localeCompare(b.id.slice(0,10)+(b.settle.at||b.updatedAt||"")));
  if(rs.length<2){box.hidden=true;box.innerHTML="";return;}
  let c=0;const P=[{r:null,p:0,v:0}].concat(rs.map(r=>({r,p:r.settle.profit||0,v:(c+=r.settle.profit||0)})));
  const W=340,H=180,L=46,Rm=12,T=12,B=24,n=P.length;
  const vals=P.map(q=>q.v);let lo=Math.min(0,...vals),hi=Math.max(0,...vals);
  const step=niceStep(Math.max(hi-lo,300)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const x=i=>L+(W-L-Rm)*i/(n-1), y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-Rm}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(${v===0?"--sub":"--line"})" stroke-width="1"${v===0?' opacity=".7"':""}/><text class="ax" x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v===0?"0":(v>0?"+":"−")+Math.abs(v).toLocaleString("ja-JP")}</text>`;}
  const d=P.map((q,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(q.v).toFixed(1)).join(" ");
  const last=P[n-1], lx=x(n-1), ly=y(last.v);
  box.innerHTML=`<h3>収支の移り変わり</h3><div class="sub" style="font-size:12.5px">線が上がると勝ち越し、下がると負け越し（円）。指でなぞると各レースの収支が出ます。</div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="収支の移り変わり。${n-1}レースで${sgn(last.v)}">
    ${g}
    <text class="ax" x="${L}" y="${H-6}">はじめ</text><text class="ax" x="${W-Rm}" y="${H-6}" text-anchor="end">${n-1}レース目</text>
    <path d="${d}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="chX" y1="${T}" y2="${H-B}" stroke="var(--sub)" stroke-width="1" visibility="hidden"/>
    <circle id="chDot" r="4" fill="var(--chart)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--chart)" stroke="var(--card)" stroke-width="2"/>
    <rect id="chHit" x="${L}" y="0" width="${W-L-Rm}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="chTip" hidden></div>`;
  box.hidden=false;
  const svg=box.querySelector("svg"),hit=box.querySelector("#chHit"),cx=box.querySelector("#chX"),dot=box.querySelector("#chDot"),tip=box.querySelector("#chTip");
  const at=e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*W/r.width;const i=Math.max(1,Math.min(n-1,Math.round((sx-L)/(W-L-Rm)*(n-1))));
    const q=P[i],px=x(i);cx.setAttribute("x1",px);cx.setAttribute("x2",px);cx.setAttribute("visibility","visible");
    dot.setAttribute("cx",px);dot.setAttribute("cy",y(q.v));dot.setAttribute("visibility","visible");
    const st=q.r.settle;tip.innerHTML=`<b>${esc(q.r.id)}</b><br>${st.voided?"返還":st.hit?"的中":"はずれ"} ${sgn(q.p)}<br>ここまでの収支 <b>${sgn(q.v)}</b>`;tip.hidden=false;
    const left=px*r.width/W, tw=tip.offsetWidth;tip.style.top=svg.offsetTop+"px";tip.style.left=Math.max(0,Math.min(r.width-tw,left-tw/2))+"px";};
  const off=()=>{cx.setAttribute("visibility","hidden");dot.setAttribute("visibility","hidden");tip.hidden=true;};
  hit.addEventListener("pointerdown",at);hit.addEventListener("pointermove",at);
  hit.addEventListener("pointerleave",off);hit.addEventListener("pointercancel",off);
}

/* ---------- 控え・機種変更（ふだんは使わない） ---------- */
function canShareFile(){try{return !!navigator.canShare&&navigator.canShare({files:[new File(["{}"],"t.txt",{type:"text/plain"})]});}catch(e){return false;}}
$("backupBtn").onclick=async()=>{
  const name="競輪Ver3_全データ_"+new Date(Date.now()+9*3600e3).toISOString().slice(0,16).replace(/[-:]/g,"").replace("T","_");
  try{
    if(Drive.avail()){msg("footMsg","ドライブに保存中…");await Drive.saveFull();await Store.save([]);msg("footMsg","ドライブに控えを残しました。","ok");return;}
    const text=JSON.stringify(fullData());
    if(canShareFile()){await navigator.share({files:[new File([text],name+".txt",{type:"text/plain"})],title:name});}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name+".json";document.body.appendChild(a);a.click();a.remove();}
    S.lastFull=new Date().toISOString();await Store.save([]);msg("footMsg","控えを残しました。","ok");
  }catch(e){if(e?.name!=="AbortError")msg("footMsg","控えを残せませんでした。","err");}
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async()=>{
  try{
    const files=[...($("importFile").files||[])];if(!files.length)return;
    for(const f of files)mergeData(JSON.parse(await f.text()));
    await Store.save(Object.values(R),(i,m)=>msg("footMsg","読み込み中… "+i+"/"+m));
    msg("footMsg","読み込みました（記録 "+Object.keys(R).length+"レース）。","ok");renderLists();autoLearn();
  }catch(e){msg("footMsg","読み込めませんでした。競輪予想の控えファイルを選んでください。","err");}
  $("importFile").value="";
};

/* ---------- アプリとして入れる（ブラウザで開いたときだけ） ---------- */
let installEvt=null;
const isApp=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function renderInstall(){
  const show=!window.claude?.use&&!isApp()&&/^https?:$/.test(location.protocol);
  $("installCard").hidden=!show;$("installBtn").hidden=!installEvt;$("installHelp").hidden=!!installEvt;$("installNote").hidden=!installEvt;
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;renderInstall();});
window.addEventListener("appinstalled",()=>{installEvt=null;$("installCard").hidden=true;});
$("installBtn").onclick=async()=>{
  if(!installEvt)return;installEvt.prompt();
  const r=await installEvt.userChoice.catch(()=>null);
  if(r?.outcome==="accepted"){msg("installMsg","入れました。アプリ一覧の「競輪予想3」から開いてください。","ok");installEvt=null;}
  renderInstall();
};

/* ---------- 貼り付けたらすぐ読む ---------- */
let pasteTimer=null;
$("paste").addEventListener("paste",e=>{const t=e.clipboardData?.getData("text");if(t&&t.trim()){e.preventDefault();onPasted(t);}});
$("paste").addEventListener("input",()=>{clearTimeout(pasteTimer);pasteTimer=setTimeout(()=>{const v=$("paste").value;if(v.trim().length>=60)onPasted(v);},700);});

/* ---------- 起動 ---------- */
(async()=>{
  $("ver").textContent="版 "+K.VERSION;
  await Promise.all([Store.init(),Drive.init()]);
  const d=await Store.load();
  R=d.races||{};
  let loaded=false;
  if(d.state){S=K.migrate(d.state);loaded=true;}
  else if(!Object.keys(R).length&&Drive.avail()){
    // クラウドが空のとき：ドライブの控えから自動で読み込む
    msg("pasteMsg","前回までの記録を読み込んでいます…");
    try{await Drive.restore();loaded=!!S.updatedAt;await Store.save(Object.values(R));}catch(e){}
    msg("pasteMsg","");
  }
  if(!loaded){try{const seed=JSON.parse($("seed").textContent);if(seed&&seed.theta){S=K.migrate(seed);S.seeded=true;}}catch(e){}}
  $("footNote").textContent=Drive.avail()?"ふだんは使いません。記録はクラウドとドライブに自動で保存されています。":"ふだんは使いません。記録はこのスマホに自動で保存されています。機種変更の前に「控えを残す」でドライブなどに保存し、新しいスマホで読み込んでください。";
  renderLists();renderInstall();
  if(!window.claude?.use&&"serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  autoLearn();
})();
}
</script>
