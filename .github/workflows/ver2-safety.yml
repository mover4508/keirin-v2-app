name: Ver.2 safety tests
on:
  pull_request:
  push:
    branches:
      - verification-access-20261120
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run safety regression tests
        run: node --test tests/*.test.mjs
