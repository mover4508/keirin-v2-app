name: Verify PWA and race discovery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check embedded application JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          assert scripts, "No inline application script"
          Path("/tmp/keirin-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/keirin-app.js
          node --check sw.js
          node tests/risk.test.cjs
      - name: Check Python syntax and discovery parser
        run: |
          python -m py_compile scripts/discover_races.py
          python -m unittest discover -s tests -v
